name: Trend Module — Pytrends Weekly Ingestion

# Runs every Monday at 05:00 UTC. Adjust cron schedule below if needed.
# Crontab format: minute hour day-of-month month day-of-week
#   - "0 5 * * 1" = at 05:00 UTC every Monday
on:
  schedule:
    - cron: '0 5 * * 1'
  # Allow manual triggering from the Actions tab (useful for testing)
  workflow_dispatch:
    inputs:
      industry:
        description: 'Limit to a single industry slug (optional)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (no Upstash writes)'
        required: false
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Pytrends rate limit + 290 queries = ~30 min worst case. Give ourselves
    # comfortable headroom.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: trend-module/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytrends ingestion
        working-directory: trend-module/scripts
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          INDUSTRY_INPUT: ${{ github.event.inputs.industry }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$INDUSTRY_INPUT" ]; then
            ARGS="$ARGS --industry $INDUSTRY_INPUT"
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running with args: $ARGS"
          python ingest_trends.py $ARGS
