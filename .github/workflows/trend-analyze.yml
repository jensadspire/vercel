name: Trend Module — Event Detection (Analysis)

# Runs every Monday at 06:00 UTC, one hour after the ingestion completes.
# Can also be triggered manually for CLI inspection or re-running analysis
# on existing data without re-fetching from pytrends.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      industry:
        description: 'Limit analysis to a single industry slug (optional)'
        required: false
        type: string
        default: ''
      country:
        description: 'Limit analysis to a single country code (optional, e.g. DK)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (compute but do not write events)'
        required: false
        type: boolean
        default: false
      cli_mode:
        description: 'CLI mode (print sorted signals table, no writes)'
        required: false
        type: boolean
        default: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Needed so the "Commit CSV report" step can push trend-reports/ back to the repo.
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: trend-module/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trend analysis
        working-directory: trend-module/scripts
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          INDUSTRY_INPUT: ${{ github.event.inputs.industry }}
          COUNTRY_INPUT: ${{ github.event.inputs.country }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          CLI_INPUT: ${{ github.event.inputs.cli_mode }}
        run: |
          ARGS=""
          if [ -n "$INDUSTRY_INPUT" ]; then
            ARGS="$ARGS --industry $INDUSTRY_INPUT"
          fi
          if [ -n "$COUNTRY_INPUT" ]; then
            ARGS="$ARGS --country $COUNTRY_INPUT"
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$CLI_INPUT" = "true" ]; then
            ARGS="$ARGS --cli"
          else
            # Scheduled / non-CLI runs also export the weekly CSV report.
            ARGS="$ARGS --csv"
          fi
          echo "Running with args: $ARGS"
          python analyze_trends.py $ARGS

      - name: Commit CSV report
        # Skip on manual CLI-only inspection runs (no CSV is produced then).
        if: ${{ github.event.inputs.cli_mode != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain trend-reports/)" ]; then
            git add trend-reports/
            git commit -m "Trend report: $(date -u +%Y-%m-%d) weekly CSV [skip ci]"
            git push
          else
            echo "No new CSV changes to commit."
          fi
